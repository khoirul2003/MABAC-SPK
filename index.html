<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MABAC Method Implementation</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="container">
      <h1>MABAC Method Implementation</h1>

      <label for="numCriteria">Number of Criteria: </label>
      <input type="number" id="numCriteria" placeholder="Enter number of criteria">

      <label for="numAlternatives">Number of Alternatives: </label>
      <input type="number" id="numAlternatives" placeholder="Enter number of alternatives">

      <button onclick="generateTables()">Generate Tables</button>

      <div id="criteriaForm" style="display: none;">
        <h2>Input Weights for Criteria</h2>
        <table id="criteriaWeightsTable"></table>
      </div>

      <div id="decisionMatrixForm" style="display: none;">
        <h2>Input Decision Matrix</h2>
        <table id="decisionMatrixTable"></table>
      </div>

      <button onclick="calculateMatrices()">Calculate MABAC</button>

      <h2>Results</h2>
      <div id="results"></div>

      <input type="file" id="fileInput" accept=".xlsx" />
      <button onclick="importExcel()">Import Excel</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
    <script src="script.js"></script>
  </body>

</html>
